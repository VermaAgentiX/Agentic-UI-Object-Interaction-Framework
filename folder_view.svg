<svg xmlns="http://w3.org" viewBox="100 80 600 460" width="100%" height="100%">
  <defs>
    <!-- Holographic Cyan Glow / Neon Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Sci-fi Metallic/Glass Gradients (Optimized for dark background UI) -->
    <linearGradient id="backPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005b7f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#001a33" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="frontPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#003366" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#001122" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </linearGradient>
    <!-- CSS Keyframe Animations -->
    <style>
      /* Holographic Document Hover/Float Effect */
      @keyframes floatData {
        0% {
          transform: translate(0, -35px);
          opacity: 0.7;
        }

        50% {
          transform: translate(0, -50px);
          opacity: 1;
          filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.6));
        }

        100% {
          transform: translate(0, -35px);
          opacity: 0.7;
        }
      }

      /* Front Panel Opening Sequence */
      @keyframes folderOpen {
        0% {
          transform: scaleY(0.85) skewX(2deg);
          opacity: 0.5;
        }

        100% {
          transform: scaleY(1) skewX(0deg);
          opacity: 1;
        }
      }

      /* Core Energy Beam Pulsing */
      @keyframes laserPulse {
        0% {
          opacity: 0.3;
          stroke-width: 2px;
        }

        50% {
          opacity: 1;
          stroke-width: 5px;
        }

        100% {
          opacity: 0.3;
          stroke-width: 2px;
        }
      }

      /* Warning Data Node Pulse */
      @keyframes beaconPulse {

        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }

        50% {
          transform: scale(1.4);
          opacity: 1;
          fill: #ff3377;
        }
      }

      /* Class Mappings */
      .anim-hologram {
        animation: floatData 4s ease-in-out infinite;
        transform-origin: center center;
      }

      .anim-front-flap {
        animation: folderOpen 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transform-origin: 400px 390px;
      }

      .anim-laser {
        animation: laserPulse 2s ease-in-out infinite;
      }

      .anim-beacon {
        animation: beaconPulse 1.5s ease-in-out infinite;
        transform-origin: 450px 225px;
      }
    </style>
  </defs>
  <!-- ==================== MAIN STRUCTURE (TRANSPARENT BACKGROUND) ==================== -->
  <g transform="translate(0, 30)">
    <!-- 1. BACK FLAP -->
    <path d="M 180,360 L 180,170 L 280,170 L 310,200 L 620,200 L 620,360 Z" fill="url(#backPanel)" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.5" />
    <!-- Back Flap Accent Details -->
    <path d="M 330,220 L 450,220" stroke="#00f3ff" stroke-width="3" filter="url(#cyanGlow)" stroke-linecap="round" />
    <circle cx="470" cy="220" r="3" fill="#00f3ff" filter="url(#cyanGlow)" />
    <circle cx="482" cy="220" r="2" fill="#00f3ff" opacity="0.7" />
    <!-- 2. HOLOGRAPHIC DATA CONTENT -->
    <g class="anim-hologram">
      <path d="M 230,250 L 230,130 L 530,130 L 570,170 L 570,250 Z" fill="#002244" fill-opacity="0.7" stroke="#00f3ff" stroke-width="2" filter="url(#cyanGlow)" />
      <!-- Internal UI Lines -->
      <g stroke="#00f3ff" opacity="0.6" stroke-width="1.5" fill="none">
        <path d="M 250,150 L 300,150 M 250,160 L 400,160" />
        <path d="M 250,180 L 510,180" />
        <path d="M 250,195 L 480,195" />
        <path d="M 250,210 L 530,210" />
        <path d="M 250,225 L 350,225" />
        <rect x="520" y="145" width="25" height="15" fill="#00f3ff" fill-opacity="0.2" stroke-width="1" />
        <path d="M 440,150 L 490,150" stroke-dasharray="2, 3" />
      </g>
      <!-- Threat Matrix Blip -->
      <line x1="450" y1="225" x2="410" y2="195" stroke="#ff0055" stroke-width="1" opacity="0.8" />
      <circle cx="410" cy="195" r="2.5" fill="#ff0055" />
      <circle class="anim-beacon" cx="450" cy="225" r="4" fill="#ff0055" filter="url(#intenseGlow)" />
    </g>
    <!-- INTERMEDIATE GLOW / LIGHT HINGE -->
    <line class="anim-laser" x1="160" y1="365" x2="640" y2="365" stroke="url(#laserLine)" stroke-width="4" filter="url(#intenseGlow)" />
    <!-- 3. FRONT FLAP -->
    <g class="anim-front-flap">
      <path d="M 140,460 L 180,360 L 620,360 L 660,460 Z" fill="url(#frontPanel)" stroke="#00f3ff" stroke-width="2.5" filter="url(#cyanGlow)" />
      <!-- Internal Bezel Highlights -->
      <path d="M 155,450 L 190,370 L 610,370 L 645,450 Z" fill="none" stroke="#00aaff" stroke-width="1" stroke-opacity="0.4" />
      <!-- Corner Hardware Plates -->
      <path d="M 175,440 L 155,440 L 187,369 L 210,369" fill="none" stroke="#00f3ff" stroke-width="3" />
      <path d="M 625,440 L 645,440 L 613,369 L 590,369" fill="none" stroke="#00f3ff" stroke-width="3" />
      <!-- Central Tech HUD Status Panel -->
      <g transform="translate(330, 395)">
        <polygon points="0,5 15,0 125,0 140,5 140,25 125,30 15,30 0,25" fill="#001122" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.8" />
        <rect x="20" y="10" width="12" height="10" fill="#00f3ff" filter="url(#cyanGlow)" />
        <rect x="37" y="10" width="12" height="10" fill="#00f3ff" filter="url(#cyanGlow)" />
        <rect x="54" y="10" width="12" height="10" fill="#00f3ff" filter="url(#cyanGlow)" opacity="0.4" />
        <rect x="71" y="10" width="12" height="10" fill="#00f3ff" filter="url(#cyanGlow)" opacity="0.1" />
        <circle cx="115" cy="15" r="4" fill="#00ff66" filter="url(#cyanGlow)" />
      </g>
    </g>
    <!-- Bottom HUD Baseline -->
    <path d="M 220,490 L 250,510 L 550,510 L 580,490" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="30, 5, 10, 5" />
  </g>
</svg>